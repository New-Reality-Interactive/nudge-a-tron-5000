<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudge-A-Tron Web</title>
<meta name="description" content="Mockup of a web client for the Nudge-A-Tron 5000 /v0 REST API. Static mock data; no network calls.">
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --surface-2: #f0ede6;
  --text: #1d1b18;
  --muted: #6b665d;
  --line: #e2ddd2;
  --accent: #d9542a;
  --accent-ink: #ffffff;
  --accent-soft: #fde6dc;
  --gentle: #2b8563;
  --gentle-soft: #dcf1e8;
  --firm: #a86d12;
  --firm-soft: #fbeed3;
  --relentless: #c2352b;
  --relentless-soft: #fadcd8;
  --ok: #2b8563;
  --quiet: #5b5fc7;
  --quiet-soft: #e3e4fa;
  --g1: #2f68c9; --g2: #b83f86; --g3: #17857f; --g4: #7650c4; --g5: #7a7a1e; --g6: #5a6472;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 4px 16px rgb(0 0 0 / 0.06);
  --radius: 14px;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141311; --surface: #1d1b19; --surface-2: #272421; --text: #eeeae3; --muted: #a39d92;
    --line: #35312c; --accent: #ff7a4d; --accent-ink: #1a0d07; --accent-soft: #3a2219;
    --gentle: #5cc79c; --gentle-soft: #16302a; --firm: #e6ad4c; --firm-soft: #33280f;
    --relentless: #ff6f61; --relentless-soft: #3a1a17; --ok: #5cc79c; --quiet: #9da1ff; --quiet-soft: #23244a;
    --g1: #6f9ff5; --g2: #f07cc0; --g3: #4ccbc2; --g4: #ab8cf5; --g5: #c2c25a; --g6: #9aa5b4;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 4px 16px rgb(0 0 0 / 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141311; --surface: #1d1b19; --surface-2: #272421; --text: #eeeae3; --muted: #a39d92;
  --line: #35312c; --accent: #ff7a4d; --accent-ink: #1a0d07; --accent-soft: #3a2219;
  --gentle: #5cc79c; --gentle-soft: #16302a; --firm: #e6ad4c; --firm-soft: #33280f;
  --relentless: #ff6f61; --relentless-soft: #3a1a17; --ok: #5cc79c; --quiet: #9da1ff; --quiet-soft: #23244a;
  --g1: #6f9ff5; --g2: #f07cc0; --g3: #4ccbc2; --g4: #ab8cf5; --g5: #c2c25a; --g6: #9aa5b4;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4), 0 4px 16px rgb(0 0 0 / 0.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { line-height: 1.2; margin: 0; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.85em; }

/* ---------- Layout ---------- */
.app { min-height: 100dvh; }
.sidebar {
  position: fixed; inset: auto 0 0 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--surface); border-top: 1px solid var(--line); z-index: 20;
}
.brand { display: none; }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); height: var(--nav-h); margin: 0; padding: 0; list-style: none; }
.nav a {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  height: 100%; color: var(--muted); text-decoration: none; font-size: 12px; font-weight: 600;
}
.nav a[aria-current="page"] { color: var(--accent); }
.nav svg { width: 22px; height: 22px; }
.nav .count {
  display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--accent);
  color: var(--accent-ink); font-size: 11px; line-height: 18px; text-align: center; margin-left: 4px;
}
.sidebar-foot { display: none; }
main { padding: 0 16px calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); max-width: 1040px; margin: 0 auto; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 0; position: sticky; top: 0; background: var(--bg); z-index: 10;
}
.topbar .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mobile-logo { font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
.mobile-logo span { color: var(--accent); }
.top-actions { display: flex; gap: 8px; align-items: center; }

@media (min-width: 860px) {
  .app { display: grid; grid-template-columns: 232px 1fr; }
  .sidebar {
    position: sticky; inset: 0 auto auto auto; height: 100dvh; padding: 20px 14px;
    border-top: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column;
  }
  .brand { display: block; font-weight: 800; font-size: 19px; letter-spacing: -0.02em; padding: 4px 10px 22px; }
  .brand span { color: var(--accent); }
  .brand small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; }
  .nav { display: flex; flex-direction: column; height: auto; gap: 2px; }
  .nav a { flex-direction: row; justify-content: flex-start; gap: 10px; padding: 9px 10px; border-radius: 10px; font-size: 15px; font-weight: 500; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .nav a > span { display: flex; flex: 1; align-items: center; }
  .nav .count { margin-left: auto; }
  .sidebar-foot { display: block; margin-top: auto; font-size: 13px; color: var(--muted); padding: 10px; }
  main { padding: 0 32px 48px; }
  .mobile-logo { display: none; }
  .topbar { padding: 22px 0 14px; }
}

/* ---------- Components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.section { margin-top: 28px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h2 { font-size: 18px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 40px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 15px; white-space: nowrap; text-decoration: none;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--relentless); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.icon { width: 40px; padding: 0; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: 0.5; cursor: not-allowed; }

.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  font-size: 12px; font-weight: 700; text-transform: capitalize; white-space: nowrap;
}
.badge.gentle { background: var(--gentle-soft); color: var(--gentle); }
.badge.firm { background: var(--firm-soft); color: var(--firm); }
.badge.relentless { background: var(--relentless-soft); color: var(--relentless); }
.state { font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); }
.state.NAGGING { background: var(--accent-soft); color: var(--accent); }
.state.ACKED { background: var(--gentle-soft); color: var(--ok); }
.state.MISSED { background: var(--relentless-soft); color: var(--relentless); }

.api {
  display: none; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px;
  color: var(--quiet); background: var(--quiet-soft); border-radius: 6px; padding: 2px 7px; width: fit-content;
  max-width: 100%; overflow-wrap: anywhere;
}
body.show-api .api { display: inline-block; }

.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; margin: 0; cursor: pointer; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgb(0 0 0 / .2); }
.switch input:checked { background: var(--quiet); }
.switch input:checked::after { transform: translateX(14px); }

/* ---------- Now view ---------- */
.hello h1 { font-size: 26px; letter-spacing: -0.02em; }
.hello p { margin: 4px 0 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.chip.quiet { color: var(--quiet); border-color: color-mix(in srgb, var(--quiet) 30%, var(--line)); }

.nag-grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .nag-grid { grid-template-columns: repeat(2, 1fr); } }
.nag { padding: 16px; display: flex; flex-direction: column; gap: 12px; border-left: 5px solid var(--accent); }
.nag.s-gentle { border-left-color: var(--gentle); }
.nag.s-firm { border-left-color: var(--firm); }
.nag.s-relentless { border-left-color: var(--relentless); }
.nag-top { display: flex; align-items: flex-start; gap: 10px; }
.nag-top h3 { font-size: 18px; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 6px; flex: none; box-shadow: 0 0 0 0 var(--accent); animation: pulse 1.6s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .sheet, .toast { transition: none; } }
.ladder { display: flex; gap: 4px; }
.ladder span { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); }
.ladder span.on { background: currentColor; }
.s-gentle .ladder { color: var(--gentle); }
.s-firm .ladder { color: var(--firm); }
.s-relentless .ladder { color: var(--relentless); }
.ladder-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0; }
.stats div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stats dt { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.stats dd { margin: 0; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stats dd small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); white-space: normal; line-height: 1.3; }
.nag-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.nag-actions .primary { flex: 1; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 4px; }

.list { list-style: none; margin: 0; padding: 0; }
.list > li + li { border-top: 1px solid var(--line); }
.row {
  display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 12px; width: 100%;
  padding: 12px 14px; background: none; border: 0; text-align: left;
}
button.row:hover { background: var(--surface-2); }
.list > li:first-child .row { border-radius: var(--radius) var(--radius) 0 0; }
.list > li:last-child .row { border-radius: 0 0 var(--radius) var(--radius); }
.list > li:only-child .row { border-radius: var(--radius); }
.row .when { font-weight: 700; font-size: 15px; line-height: 1.2; }
.row .when small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.row .what { min-width: 0; }
.row .what strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.row .what span { display: block; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.note-quiet, .row .what .note-quiet { color: var(--quiet); }
.note-carry, .row .what .note-carry { color: var(--firm); }

/* ---------- Reminders view ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 8px; }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 42px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); }
.search input { border: 0; background: none; outline: none; width: 100%; height: 100%; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; overflow-x: auto; max-width: 100%; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.rem-grid { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 16px; }
@media (min-width: 700px) { .rem-grid { grid-template-columns: repeat(2, 1fr); } }
.rem { padding: 14px 16px; text-align: left; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; width: 100%; }
.rem:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.rem-head { display: flex; gap: 10px; align-items: flex-start; }
.rem-title { flex: 1; font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.rem .sched { font-size: 14px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.rem .next { font-size: 14px; display: flex; justify-content: space-between; gap: 8px; border-top: 1px dashed var(--line); padding-top: 8px; }
.rem.done { opacity: 0.65; }

/* ---------- Sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / 0.35); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed; z-index: 50; background: var(--surface); box-shadow: 0 -8px 40px rgb(0 0 0 / .2);
  left: 0; right: 0; bottom: 0; max-height: 92dvh; border-radius: 20px 20px 0 0;
  transform: translateY(100%); transition: transform .25s ease; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom);
}
.sheet.open { transform: none; }
.sheet-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { flex: 1; font-size: 20px; min-width: 0; overflow-wrap: anywhere; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
.sheet-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 20px; }
@media (min-width: 860px) {
  .sheet { left: auto; top: 0; width: 440px; max-height: none; border-radius: 0; transform: translateX(100%); box-shadow: -8px 0 40px rgb(0 0 0 / .15); }
  .grab { display: none; }
  .sheet-head { padding-top: 22px; }
}
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 0; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.sub-h { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; margin-bottom: 8px; }
.occ { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.occ + .occ { margin-top: 8px; }
.occ > button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: none; border: 0; text-align: left; }
.occ > button:hover { background: var(--surface-2); }
.occ > button .grow { flex: 1; min-width: 0; }
.occ > button .grow small { display: block; color: var(--muted); font-size: 12px; }
.chev { transition: transform .15s; color: var(--muted); }
.occ[data-open="true"] .chev { transform: rotate(90deg); }
.timeline { list-style: none; margin: 0; padding: 4px 12px 12px 30px; position: relative; }
.timeline::before { content: ""; position: absolute; left: 17px; top: 10px; bottom: 18px; width: 2px; background: var(--line); }
.ev { position: relative; padding: 6px 0; font-size: 14px; }
.ev::before { content: ""; position: absolute; left: -17px; top: 12px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--muted); }
.ev.NAG_SENT::before { border-color: var(--accent); background: var(--accent); }
.ev.ACKED::before { border-color: var(--ok); background: var(--ok); }
.ev.MISSED::before, .ev.SEND_FAILED::before { border-color: var(--relentless); background: var(--relentless); }
.ev.DEFERRED_QUIET::before { border-color: var(--quiet); background: var(--quiet); }
.timeline time { font-weight: 700; margin-right: 6px; font-variant-numeric: tabular-nums; }
.timeline .ev-note { display: block; color: var(--muted); font-size: 12px; }

/* ---------- Escalation chart ---------- */
.esc { display: flex; flex-direction: column; gap: 5px; }
.esc-row { display: grid; grid-template-columns: 34px 1fr 64px 30px; align-items: center; gap: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.esc-row .n { color: var(--muted); }
.esc-row .bar { height: 12px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; }
.esc-row .bar i { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: currentColor; opacity: .85; }
.esc-row .pr { font-weight: 700; text-align: right; }
.esc.gentle { color: var(--gentle); }
.esc.firm { color: var(--firm); }
.esc.relentless { color: var(--relentless); }
.esc .t { color: var(--text); text-align: right; }
.esc .pr { color: var(--text); }
.esc-more { font-size: 12px; color: var(--muted); padding-left: 42px; }

/* ---------- Form ---------- */
.form-grid { display: grid; gap: 20px; grid-template-columns: 1fr; margin-top: 8px; }
@media (min-width: 980px) { .form-grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; } .preview-col { position: sticky; top: 86px; } }
.panel { padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-weight: 600; font-size: 14px; }
.field .hint { font-size: 12.5px; color: var(--muted); }
.field .err { font-size: 12.5px; color: var(--relentless); font-weight: 600; }
.input, select.input, textarea.input {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--bg); outline: none;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.input[aria-invalid="true"] { border-color: var(--relentless); }
textarea.input { min-height: 72px; resize: vertical; }
.two { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 520px) { .two { grid-template-columns: 1fr 1fr; } }
.strengths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.strengths label { position: relative; }
.strengths input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.strengths .opt { display: flex; flex-direction: column; gap: 2px; padding: 10px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); height: 100%; }
.strengths .opt b { font-size: 15px; }
.opt-desc { font-size: 12px; color: var(--muted); line-height: 1.3; }
.strengths input:checked + .opt.gentle { border-color: var(--gentle); background: var(--gentle-soft); }
.strengths input:checked + .opt.firm { border-color: var(--firm); background: var(--firm-soft); }
.strengths input:checked + .opt.relentless { border-color: var(--relentless); background: var(--relentless-soft); }
.strengths input:focus-visible + .opt { outline: 2px solid var(--accent); outline-offset: 2px; }
details.adv summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
details.adv[open] summary { margin-bottom: 12px; }
.builder { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 4px 0 0; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.b-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.b-row label, .b-label { font-weight: 600; font-size: 14px; }
.b-block { display: flex; flex-direction: column; gap: 8px; }
.input.num { width: 84px; }
.input.unit { width: auto; flex: 1 1 120px; max-width: 180px; }
.input.inline { width: auto; min-height: 38px; padding: 6px 10px; }
.input.inline.num { width: 76px; }
.input:disabled { opacity: 0.5; }
.radio { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 15px; min-height: 38px; cursor: pointer; }

/* ================= Mock clock & formatting =================
   All times are wall-clock times in the user's zone. The page pretends "now"

const L = (s) => {
  const [d, t = "00:00"] = s.split("T");
  const [y, m, dd] = d.split("-").map(Number);
  const [h, mi, se = 0] = t.split(":").map(Number);
  return new Date(y, m - 1, dd, h, mi, se);
};
const NOW = L("2026-09-28T08:20");
const pad = (n) => String(n).padStart(2, "0");
const hm = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
function dayLabel(d) {
  const a = new Date(NOW); a.setHours(0, 0, 0, 0);
  const b = new Date(d); b.setHours(0, 0, 0, 0);
  const diff = Math.round((b - a) / 864e5);
  if (diff === 0) return "Today";
  if (diff === 1) return "Tomorrow";
  if (diff === -1) return "Yesterday";
  return `${DAYS[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`;
}
const when = (d) => `${dayLabel(d)} ${hm(d)}`;

  const m = Math.round((d - NOW) / 6e4), a = Math.abs(m);
  if (a < 1) return "now";
  const s = a < 60 ? `${a} min` : a < 48 * 60 ? `${Math.round(a / 60)} h` : `${Math.round(a / 1440)} days`;
  return m > 0 ? `in ${s}` : `${s} ago`;
}

const fmtDur = (m) => (m < 60 ? `${Math.round(m)} min` : `${+(m / 60).toFixed(1)} h`);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

/* ================= Strength profiles (ADR 0005, src/domain/escalation.ts) ================= */
const PROFILES = {
  gentle:     { initial: 60, factor: 0.75, floor: 20, min: 3, max: 4, blurb: "Hourly at first, easing to every 20 min" },
  firm:       { initial: 30, factor: 0.5,  floor: 5,  min: 3, max: 5, blurb: "Every 30 min, down to every 5" },
  relentless: { initial: 10, factor: 0.5,  floor: 2,  min: 4, max: 5, blurb: "Every 10 min, down to every 2" },

const DEFAULT_CAP = { maxDurationMinutes: 1440, maxAttempts: 20 };
function maxLevel(s) { const p = PROFILES[s]; let l = 0; while (p.initial * p.factor ** l > p.floor) l++; return l; }

function simulate(s, cap = {}, startLevel = 0) {
  const maxAtt = cap.maxAttempts ?? DEFAULT_CAP.maxAttempts;
  const maxDur = cap.maxDurationMinutes ?? DEFAULT_CAP.maxDurationMinutes;
  const nags = []; let t = 0;

    t = Math.min(t + iv, maxDur);

/* Enough RRULE reading for the mock data and the New form's rules. */
function parseRRule(s) {
  const p = Object.fromEntries(s.split(";").map((kv) => kv.split("=")));
  const r = { freq: p.FREQ, interval: Number(p.INTERVAL || 1) };
  if (p.BYDAY) {
    const m = p.BYDAY.match(/^(-?\d)([A-Z]{2})$/);
    if (m) r.nth = { k: Number(m[1]), wd: m[2] }; else r.byday = p.BYDAY.split(",");
  }
  if (p.BYMONTHDAY) r.bymonthday = Number(p.BYMONTHDAY);
  if (p.BYHOUR) r.byhour = p.BYHOUR.split(",").map(Number);
  if (p.BYMINUTE) r.byminute = p.BYMINUTE.split(",").map(Number);
  return r;
}
/* Whether a rule has an occurrence on day `d`, counting from `start`. */
function dayMatches(r, start, d) {
  const monthDiff = (x) => (x.getFullYear() - start.getFullYear()) * 12 + x.getMonth() - start.getMonth();
  switch (r.freq) {
    case "DAILY": return dayDiff(start, d) % r.interval === 0;
    case "WEEKLY": {
      const monday = (x) => { const m = dateOnly(x); m.setDate(m.getDate() - ((m.getDay() + 6) % 7)); return m; };
      const days = r.byday ?? [BYDAY[start.getDay()]];
      return (dayDiff(monday(start), monday(d)) / 7) % r.interval === 0 && days.includes(BYDAY[d.getDay()]);
    }
    case "MONTHLY":
      if (monthDiff(d) % r.interval) return false;
      if (r.nth) return BYDAY[d.getDay()] === r.nth.wd && (r.nth.k < 0 ? isLastOfMonth(d) : Math.ceil(d.getDate() / 7) === r.nth.k);
      return d.getDate() === (r.bymonthday ?? start.getDate());
    default:
      return (d.getFullYear() - start.getFullYear()) % r.interval === 0 && d.getMonth() === start.getMonth() && d.getDate() === start.getDate();

/* A reminder's scheduled times on one day. */
function timesOnDay(rem, day) {
  const start = L(rem.dtstart);
  if (!rem.rrule) return dayDiff(start, day) === 0 ? [start] : [];
  if (dateOnly(day) < dateOnly(start)) return [];
  const r = parseRRule(rem.rrule);
  if (r.freq === "HOURLY") {
    const step = r.interval * 36e5, from = dateOnly(day).getTime(), to = from + 864e5;
    const out = [];
    for (let t = start.getTime() + Math.max(0, Math.ceil((from - start.getTime()) / step)) * step; t < to; t += step) out.push(new Date(t));
    return out;

  if (!dayMatches(r, start, day)) return [];
  const hours = r.byhour ?? [start.getHours()], mins = r.byminute ?? [start.getMinutes()];
  return hours.flatMap((h) => mins.map((m) => { const d = new Date(day); d.setHours(h, m, 0, 0); return d; }))
    .filter((d) => d >= start).sort((a, b) => a - b);

const TZS = ["America/New_York", "America/Chicago", "America/Denver", "America/Los_Angeles", "Europe/London", "Europe/Berlin", "Asia/Tokyo", "Australia/Sydney"];

const ord = (n) => n + (n % 10 === 1 && n !== 11 ? "st" : n % 10 === 2 && n !== 12 ? "nd" : n % 10 === 3 && n !== 13 ? "rd" : "th");
const dateOnly = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };

/* The custom builder, seeded from whichever preset was picked before it. */
function seedCustom(x) {
  const d = startOf(x), wd = BYDAY[d.getDay()];

/* Presets and the custom builder both become one rule object, which drives the RRULE, the
   summary sentence and the upcoming dates, so the three can't disagree. */
function toRule(x) {
  const d = startOf(x), wd = BYDAY[d.getDay()];

function ack(occId) {
  const o = occurrences.find((x) => x.id === occId);
  if (o?.state !== "NAGGING") { toast("Already closed", "200 · outcome: already_closed"); return; }
  o.state = "ACKED"; o.closedAt = iso(NOW); o.nextNagAt = null;
  if (!o.events) o.events = [];
  o.events.push(ev("ACKED", iso(NOW)));
  const r = remById(o.reminderId);
  if (!r.rrule) r.status = "COMPLETED";
  toast(`“${r.title}” done. Nagging stopped.`, `200 POST /v0/occurrences/${o.id}/ack · outcome: acked`);
  render(); if (state.sheet) renderSheet();
}
function del(id) {
  const r = remById(id);
  if (!confirm(`Delete “${r.title}”? Any open occurrence is cancelled.`)) return;
  reminders = reminders.filter((x) => x.id !== id);
  occurrences.filter((o) => o.reminderId === id && o.state === "NAGGING").forEach((o) => { o.state = "CANCELLED"; o.closedAt = iso(NOW); });
  closeSheet(); render();
  toast("Reminder deleted", `204 DELETE /v0/reminders/${id}`);
}

}

  else if ("addgroup" in a.dataset) { state.addingGroup = true; state.groupErr = ""; render(); }
  else if ("addgroupCancel" in a.dataset) { state.addingGroup = false; state.groupErr = ""; render(); }
  else if ("newin" in a.dataset) { state.draft = null; state.newIn = a.dataset.newin; }
});
document.getElementById("scrim").addEventListener("click", closeSheet);
document.addEventListener("change", (e) => {
  if (e.target.id !== "sheet-group") return;
  const r = remById(state.sheet);
  r.groupId = e.target.value || null;
  toast(`Moved to ${groupName(r.groupId || "none")}`, `200 PATCH /v0/reminders/${r.id} { groupId } · proposed`);
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && state.sheet) closeSheet(); });
window.addEventListener("hashchange", () => { closeSheet(); render(); window.scrollTo(0, 0); });

const apiToggle = document.getElementById("api-toggle");
try { apiToggle.checked = localStorage.getItem("nt5k-mock-api") === "1"; } catch {}
document.body.classList.toggle("show-api", apiToggle.checked);
apiToggle.addEventListener("change", () => {
  document.body.classList.toggle("show-api", apiToggle.checked);
  try { localStorage.setItem("nt5k-mock-api", apiToggle.checked ? "1" : "0"); } catch {}
});
document.getElementById("theme-btn").addEventListener("click", () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});

render();
</script>
</body>
</html>
