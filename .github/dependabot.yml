version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # @cloudflare/vitest-pool-workers pins a vitest major via its peer range
      # (currently ^4.1.0). Remove this once the pool supports the next major.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Types must match the runtime pinned in .nvmrc/engines (Node 24 LTS).
      # Bump this together with .nvmrc when moving to the next LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Vitest, its plugins and the Workers pool have lockstep peer ranges, so
      # they must move in a single PR. Listed first: a dependency joins the
      # first group it matches.
      vitest:
        patterns: ["vitest", "@vitest/*", "@cloudflare/vitest-pool-workers"]
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
