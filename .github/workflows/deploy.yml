name: Deploy

# Inert until the CLOUDFLARE_API_TOKEN repository secret exists: the preflight
# job reports whether it is set and both deploy jobs are skipped otherwise.
# Every deploy first runs the full CI suite (ci.yml via workflow_call), and a
# production deploy additionally requires the tagged commit to be on main.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Skip staging deploys when a push to main only touches files that cannot
    # affect the Worker bundle or the database. This is an ignore list on
    # purpose: anything not listed (including new files) deploys. Path filters
    # are not evaluated for tag pushes, so v* tags always deploy.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "test/**"
      - "requests/**"
      - "openapi/**"
      - ".oasdiff.yaml"
      - ".github/oasdiff-levels.txt"
      - ".vscode/**"
      - ".github/dependabot.yml"
      - ".github/pull_request_template.md"
      - "**/biome.json"
      - "biome-plugins/**"
      - "vitest.config.ts"
      - ".editorconfig"
      - ".gitignore"
      - ".dev.vars.example"
  # Manual redeploy: run on main for staging, or on a v* tag for production.
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy."
          fi

  verify:
    needs: preflight
    if: ${{ needs.preflight.outputs.enabled == 'true' }}
    uses: ./.github/workflows/ci.yml

  staging:
    needs: [preflight, verify]
    if: ${{ needs.preflight.outputs.enabled == 'true' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to staging
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  production:
    needs: [preflight, verify]
    if: ${{ needs.preflight.outputs.enabled == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit to be on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points at ${GITHUB_SHA}, which is not on main. Refusing to deploy."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply DB --remote --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to production
        run: npx wrangler deploy --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
